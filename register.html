<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Page metadata and the shared application stylesheet. -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grocery Management System - Registration</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-page="register">
    <!-- Registration screen for creating a customer account. -->
    <div class="auth-container">
      <h1>Grocery Management System</h1>
      <h2>Registration</h2>

      <!-- JavaScript validates these fields and stores the new account locally. -->
      <form id="registerForm" novalidate>
        <div class="field-group">
          <label for="firstName">First Name</label>
          <input type="text" id="firstName" name="firstname" placeholder="Enter your first name" required />
        </div>

        <div class="field-group">
          <label for="lastName">Last Name</label>
          <input type="text" id="lastName" name="lastname" placeholder="Enter your last name" required />
        </div>

        <div class="field-group">
          <label for="email">Email ID</label>
          <input type="email" id="email" name="emailid" placeholder="Enter your email" required />
        </div>

        <div class="field-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Minimum 16 chars with uppercase, lowercase, number, special char" required />
        </div>

        <div class="field-group">
          <label for="confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter your password" required />
        </div>

        <button type="submit" class="primary-btn">Register</button>
      </form>

      <!-- Link back to the existing-account login screen. -->
      <p class="switch-link">
        Already registered?
        <a href="index.html">Login here</a>
      </p>
    </div>

    <!-- The shared script attaches the registration submit handler. -->
    <script src="script.js"></script>
  </body>
</html>
